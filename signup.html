<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="view-transition" content="same-origin" />
  <title>Sign up â€” Prismx</title>
  <link rel="icon" href="logo.png" />
  <link rel="stylesheet" href="styles.css?v=8" />
</head>
<body>
  <header class="nav">
    <a class="brand" href="index.html">
      <img src="logo.png" alt="" />
      <span>Prismx</span>
    </a>
    <nav class="nav-links" aria-label="Page">
      <a href="index.html#looks">Looks</a>
      <a href="index.html#product">Product</a>
      <a href="index.html#pricing">Pricing</a>
      <a class="nav-download" href="download.html">Download</a>
      <a class="nav-signin" id="navSignIn" href="signin.html">Sign in</a>
      <a class="nav-cta" id="navSignUp" href="signup.html" aria-current="page">Sign up</a>
    </nav>
    <button class="nav-toggle" type="button" aria-label="Menu" aria-expanded="false">
      <span></span><span></span>
    </button>
  </header>

  <main class="account">
    <section class="account-card reveal">
      <img class="account-mark" src="logo.png" alt="" />
      <h1>Sign up</h1>
      <p class="lede">Pick a username and a password. Email comes later, at checkout.</p>
      <form id="signUpForm">
        <label>Username<input type="text" name="username" autocomplete="username" required minlength="3" maxlength="20" pattern="[A-Za-z0-9_]{3,20}" placeholder="Username" /></label>
        <label>Password<input type="password" name="password" autocomplete="new-password" required minlength="8" placeholder="At least 8 characters" /></label>
        <label>Confirm password<input type="password" name="confirm" autocomplete="new-password" required minlength="8" placeholder="Repeat the password" /></label>
        <button class="btn primary" type="submit">Sign up</button>
        <p class="form-note" id="formNote" role="status"></p>
      </form>
      <p class="swap">Already have one? <a id="goSignIn" href="signin.html">Sign in</a></p>
    </section>
  </main>
  <script src="site.js?v=6"></script>
  <script src="auth.js?v=13"></script>
</body>
</html>
